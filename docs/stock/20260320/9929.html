<script>
// 搜尋股號
(function(){
  const si = document.getElementById('stock-search');
  if (!si) return;
  const missEl = document.createElement('div');
  Object.assign(missEl.style, {
    position:'fixed', top:'42px', right:'8px', background:'#e74c3c', color:'#fff',
    padding:'4px 10px', borderRadius:'8px', fontSize:'11px', zIndex:'10000',
    opacity:'0', transition:'opacity 0.3s', pointerEvents:'none'
  });
  missEl.textContent = '未在今日漲停';
  document.body.appendChild(missEl);
  si.addEventListener('click', () => { si.value = ''; si.style.borderColor = '#30363d'; });
  const doSearch = () => {
    const code = si.value.trim();
    if (code.length < 4) return;
    const card = document.querySelector('.stock-card[data-code="' + code + '"]');
    document.querySelectorAll('.stock-card.search-hit').forEach(c => { c.style.outline = ''; c.classList.remove('search-hit'); });
    if (card) {
      si.style.borderColor = '#30363d';
      missEl.style.opacity = '0';
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.outline = '2px solid #58a6ff';
      card.classList.add('search-hit');
    } else {
      si.style.borderColor = '#e74c3c';
      missEl.style.opacity = '1';
      setTimeout(() => { missEl.style.opacity = '0'; }, 2000);
    }
  };
  si.addEventListener('input', doSearch);
  si.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
})();
// 股票卡片 hover 動畫
document.querySelectorAll('.stock-card a').forEach(card => {
  card.addEventListener('mouseenter', function() { this.style.transform='translateY(-1px)'; this.style.boxShadow='0 4px 12px rgba(88,166,255,0.15)'; });
  card.addEventListener('mouseleave', function() { this.style.transform='translateY(0)'; this.style.boxShadow='none'; });
});
</script>
