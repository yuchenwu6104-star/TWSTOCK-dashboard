name: Daily Taiwan Stock Update

on:
  schedule:
    - cron: '10 7 * * 1-5'  # UTC 07:10 = 台灣 15:10
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
        run: python crawler/daily_run.py

      - name: Build static site
        run: python generator/build_site.py

      - name: Commit & Push
        run: |
          git config user.email "bot@github.com"
          git config user.name "Stock Bot"
          git add output/ -f
          git add -A
          git commit -m "daily update $(date +%Y%m%d)" || exit 0
          git push
